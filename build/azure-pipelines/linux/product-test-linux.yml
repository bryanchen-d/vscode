parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_SUITE
    type: string
    values:
      - Electron
      - Browser
      - Remote
  - name: DEPENDS_ON
    type: string
    default: ''

jobs:
  - job: LinuxTest_${{ parameters.VSCODE_ARCH }}_${{ parameters.VSCODE_TEST_SUITE }}
    displayName: Linux (${{ upper(parameters.VSCODE_ARCH) }}) Tests - ${{ parameters.VSCODE_TEST_SUITE }}
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    timeoutInMinutes: 60
    variables:
      DISPLAY: ":10"
      NPM_ARCH: ${{ parameters.VSCODE_ARCH }}
      VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(VSCODE_ARCH)-${{ lower(parameters.VSCODE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      - template: ../common/checkout.yml@self

      - task: NodeTool@0
        inputs:
          versionSource: fromFile
          versionFilePath: .nvmrc

      - template: ../distro/download-distro.yml@self

      - task: AzureKeyVault@2
        displayName: "Azure Key Vault: Get Secrets"
        inputs:
          azureSubscription: vscode
          KeyVaultName: vscode-build-secrets
          SecretsFilter: "github-distro-mixin-password"

      - script: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libgbm1 \
            bubblewrap \
            socat
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start
        displayName: Setup system services

      - script: node build/setup-npm-registry.ts $NPM_REGISTRY
        condition: and(succeeded(), ne(variables['NPM_REGISTRY'], 'none'))
        displayName: Setup NPM Registry

      # Reuse the same cache key as the build job so we hit the populated cache without rerunning npm ci.
      - script: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts linux $VSCODE_ARCH $(node -p process.arch) > .build/packagelockhash
        displayName: Prepare node_modules cache key

      - task: Cache@2
        inputs:
          key: '"node_modules" | .build/packagelockhash'
          path: .build/node_modules_cache
          cacheHitVar: NODE_MODULES_RESTORED
        displayName: Restore node_modules cache

      - script: tar -xzf .build/node_modules_cache/cache.tgz
        condition: and(succeeded(), eq(variables.NODE_MODULES_RESTORED, 'true'))
        displayName: Extract node_modules cache

      # Fallback: rebuild node_modules if the cache miraculously missed (should not happen — build job seeded it).
      - script: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "Npm install failed too many times" >&2; exit 1; fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: $(NPM_ARCH)
          VSCODE_ARCH: $(VSCODE_ARCH)
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: "$(github-distro-mixin-password)"
        displayName: Install dependencies (cache miss fallback)
        condition: and(succeeded(), ne(variables.NODE_MODULES_RESTORED, 'true'))

      - script: node build/azure-pipelines/distro/mixin-npm.ts
        condition: and(succeeded(), ne(variables.NODE_MODULES_RESTORED, 'true'))
        displayName: Mixin distro node modules

      - script: node build/azure-pipelines/distro/mixin-quality.ts
        displayName: Mixin distro quality

      - template: ../common/install-builtin-extensions.yml@self

      - script: |
          set -e
          npm run compile --prefix test/smoke
          npm run compile --prefix test/integration/browser
        displayName: Compile test suites

      # Pull the artifacts produced by the build job and expand them to the layout the test scripts expect.
      - task: DownloadPipelineArtifact@2
        displayName: Download client archive
        inputs:
          artifact: vscode_client_linux_$(VSCODE_ARCH)_archive-unsigned
          path: $(Build.ArtifactStagingDirectory)/dl/client

      - script: |
          set -e
          tar -xzf $(Build.ArtifactStagingDirectory)/dl/client/*.tar.gz -C $(Agent.BuildDirectory)
          ls -la $(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)
        displayName: Extract client archive

      - ${{ if or(eq(parameters.VSCODE_TEST_SUITE, 'Electron'), eq(parameters.VSCODE_TEST_SUITE, 'Remote')) }}:
        - task: DownloadPipelineArtifact@2
          displayName: Download server archive
          inputs:
            artifact: vscode_server_linux_$(VSCODE_ARCH)_archive-unsigned
            path: $(Build.ArtifactStagingDirectory)/dl/server

        - script: |
            set -e
            tar -xzf $(Build.ArtifactStagingDirectory)/dl/server/vscode-server-linux-$(VSCODE_ARCH).tar.gz -C $(Agent.BuildDirectory)
          displayName: Extract server archive

      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Browser') }}:
        - task: DownloadPipelineArtifact@2
          displayName: Download web server archive
          inputs:
            artifact: vscode_web_linux_$(VSCODE_ARCH)_archive-unsigned
            path: $(Build.ArtifactStagingDirectory)/dl/web

        - script: |
            set -e
            tar -xzf $(Build.ArtifactStagingDirectory)/dl/web/vscode-server-linux-$(VSCODE_ARCH)-web.tar.gz -C $(Agent.BuildDirectory)
          displayName: Extract web server archive

      - script: npm exec -- npm-run-all2 -lp "electron $(VSCODE_ARCH)" "playwright-install"
        env:
          GITHUB_TOKEN: "$(github-distro-mixin-password)"
        displayName: Download Electron and Playwright
        retryCountOnTaskFailure: 3

      - script: |
          set -e
          APP_ROOT=$(Agent.BuildDirectory)/VSCode-linux-$(VSCODE_ARCH)
          ELECTRON_ROOT=.build/electron
          sudo chown root $APP_ROOT/chrome-sandbox
          sudo chown root $ELECTRON_ROOT/chrome-sandbox
          sudo chmod 4755 $APP_ROOT/chrome-sandbox
          sudo chmod 4755 $ELECTRON_ROOT/chrome-sandbox
        displayName: Change setuid helper binary permission

      - ${{ if eq(parameters.VSCODE_TEST_SUITE, 'Electron') }}:
        - script: npx deemon --detach --wait -- node build/azure-pipelines/common/downloadCopilotVsix.ts
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          displayName: Download Copilot VSIX

      # Build integration test extensions (needed by integration + smoke).
      - script: |
          set -e
          npm run gulp \
            compile-extension:configuration-editing \
            compile-extension:css-language-features-server \
            compile-extension:emmet \
            compile-extension:git \
            compile-extension:github-authentication \
            compile-extension:html-language-features-server \
            compile-extension:ipynb \
            compile-extension:notebook-renderers \
            compile-extension:json-language-features-server \
            compile-extension:markdown-language-features \
            compile-extension-media \
            compile-extension:microsoft-authentication \
            compile-extension:typescript-language-features \
            compile-extension:vscode-api-tests \
            compile-extension:vscode-colorize-tests \
            compile-extension:vscode-colorize-perf-tests \
            compile-extension:vscode-test-resolver
        displayName: Build integration tests

      - template: ./steps/product-build-linux-test.yml@self
        parameters:
          VSCODE_RUN_ELECTRON_TESTS: ${{ eq(parameters.VSCODE_TEST_SUITE, 'Electron') }}
          VSCODE_RUN_BROWSER_TESTS: ${{ eq(parameters.VSCODE_TEST_SUITE, 'Browser') }}
          VSCODE_RUN_REMOTE_TESTS: ${{ eq(parameters.VSCODE_TEST_SUITE, 'Remote') }}
